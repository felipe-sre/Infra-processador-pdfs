name: "SRE - Observability & Alert Bot CI"

on:
  push:
    branches:
      - main
    paths:
      - 'sre/**'
      - '.github/workflows/sre_deploy.yml'

jobs:
  sre_validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 'Validate K8s Manifests Syntax'
        run: |
          python3 -c "import yaml, glob; [list(yaml.safe_load_all(open(f))) for f in glob.glob('sre/k8s-manifests/*.y*ml')]"

      - name: 'Build & Test Docker Alert Bot'
        run: |
          cd sre/alerting
          docker build -t docker-alert-bot:latest .