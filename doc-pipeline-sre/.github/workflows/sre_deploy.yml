name: "SRE - Observability & Alert Bot CI"

on:
  push:
    branches:
      - main
    paths:
      - 'sre/**'

jobs:
  sre_validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 'Validate K8s Manifests'
        run: |
          kubectl apply --dry-run=client -f sre/k8s-manifests/

      - name: 'Build & Test Docker Alert Bot'
        run: |
          cd sre/alerting
          docker build -t docker-alert-bot:latest .