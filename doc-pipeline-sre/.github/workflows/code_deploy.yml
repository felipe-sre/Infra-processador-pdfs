name: "Code - Cloud Function & Airflow DAGs Deployment"

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'  # Roda quando há mudanças na pasta src/

jobs:
  test_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 'Run Python Tests'
        run: |
          pip install -r src/cloud_function/requirements.txt
          pytest src/cloud_function/tests/
          
      - name: 'Configure GCP Credentials'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: 'Deploy Cloud Function'
        uses: google-github-actions/deploy-cloud-functions@v2
        with:
          name: pdf-processor-function
          source_dir: src/cloud_function/
          runtime: python311
          # ... (outras configurações da Cloud Function)
          
      - name: 'Upload Airflow DAGs to Composer'
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: src/composer/dags/document_pipeline_dag.py
          destination: seu-bucket-composer/dags/