name: "Code - AWS Lambda & Airflow DAGs Deployment"

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'

jobs:
  test_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 'Set up Python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 'Run Python Tests for Lambda'
        run: |
          pip install -r src/processor/requirements.txt pytest
          pytest src/processor/tests/

      - name: 'Validate Airflow DAG Syntax'
        run: |
          python -m py_compile src/airflow/dags/document_pipeline_dag.py

      - name: 'Configure AWS Credentials'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: 'Package & Deploy AWS Lambda'
        run: |
          cd src/processor
          zip -r ../../lambda_payload.zip main.py requirements.txt
          cd ../..
          aws lambda update-function-code \
            --function-name pdf-processor-dev \
            --zip-file fileb://lambda_payload.zip