global:
  resolve_timeout: 5m
  # Substitua pela sua URL do Webhook do Slack (Incoming Webhook)
  slack_api_url: 'https://hooks.slack.com/services/SEU/WEBHOOK/AQUI'

# Roteamento de Alertas
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'slack-notifications'

  # Sub-rotas para criticidade de incidentes (SRE)
  routes:
    - match:
        severity: critical
      receiver: 'slack-critical'
      repeat_interval: 1h

# Regras de Inibição (Evita tempestade de alertas decorrentes do mesmo incidente)
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'dev', 'instance']

# Definição dos Destinatários
receivers:
  - name: 'slack-notifications'
    slack_configs:
      - channel: '#sre-alerts-dev'
        send_resolved: true
        title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}'
        text: >-
          *Descrição:* {{ .CommonAnnotations.description }}
          *Serviço:* `{{ .CommonLabels.service }}`
          *Severidade:* `{{ .CommonLabels.severity }}`

  - name: 'slack-critical'
    slack_configs:
      - channel: '#sre-incidents-critical'
        send_resolved: true
        color: 'danger'
        title: '🚨 CRITICAL: {{ .CommonLabels.alertname }}'
        text: >-
          *Resumo:* {{ .CommonAnnotations.summary }}
          *Detalhes:* {{ .CommonAnnotations.description }}
          *Impacto:* Violação de SLO / Falha no Pipeline de PDFs